services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-avaliacao-mnr
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: avaliacao_mnr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avaliacao_mnr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./back/avaliacao-mnr
      dockerfile: Dockerfile
    container_name: backend-avaliacao-mnr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/avaliacao_mnr_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
