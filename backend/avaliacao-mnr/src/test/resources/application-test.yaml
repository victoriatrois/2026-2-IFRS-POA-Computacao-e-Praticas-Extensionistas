spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

video:
  analyzer:
    min-duration-seconds: 180
    max-duration-seconds: 300

app:
  security:
    jwt:
      secret: "a-very-long-dummy-secret-for-testing-purposes-only-do-not-use-in-prod-12345678901234567890"
