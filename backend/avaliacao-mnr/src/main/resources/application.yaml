spring:
  application:
    name: avaliacao-mnr

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/avaliacao_mnr_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      # No default: startup must fail unless JWT_SECRET is set, or the local/test profile supplies its own fallback.
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      name: ${BOOTSTRAP_ADMIN_NAME:}
      surname: ${BOOTSTRAP_ADMIN_SURNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      cpf: ${BOOTSTRAP_ADMIN_CPF:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

video:
  analyzer:
    min-duration-seconds: 180
    max-duration-seconds: 300

server:
  port: ${PORT:8080}
